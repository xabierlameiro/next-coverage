name: PR title

# Under squash-merge the pull request title becomes the commit message on main, and it is what
# release-please reads to decide the next version. The branch's own messages survive only as bullets
# in the body, where release-please does not look, so the title is the one message worth checking.
on:
  pull_request:
    # `edited` re-runs the check the moment a title is fixed.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Through commitlint, so commitlint.config.mjs governs local commits and merged titles alike.
      # The title arrives via the environment, never interpolated into the script: a `${{ }}`
      # expansion inside `run:` would let a pull request title execute shell on the runner.
      - name: Lint the pull request title as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $PR_TITLE"
          if ! printf '%s\n' "$PR_TITLE" | pnpm exec commitlint; then
            echo
            echo "::error::The pull request title is not a Conventional Commit."
            echo "This repository squash-merges, so this title becomes the commit message on main"
            echo "and is what release-please reads to decide the next version."
            echo
            echo "Examples: 'fix: stop reporting a route the build prerendered'"
            echo "          'feat!: rename the would-apply bucket in the JSON output'"
            exit 1
          fi
