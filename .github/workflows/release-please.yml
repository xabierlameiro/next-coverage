name: Release

on:
  push:
    branches: [main]
  # Recovery hatch: publish an existing tag when the automatic run could not, such as a trusted
  # publisher configured after the release landed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.1)
        required: true

permissions:
  contents: write
  pull-requests: write
  # OIDC for npm trusted publishing: no long-lived token anywhere.
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input on purpose. Passing one puts the action in its simple mode, where it
      # builds a config from the inputs and ignores release-please-config.json, so
      # `bump-minor-pre-major` would stop applying and a breaking change would release 1.0.0.
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: npm --version
      # `prepublishOnly` typechecks, tests and builds before anything is uploaded.
      - run: npm publish --access public
